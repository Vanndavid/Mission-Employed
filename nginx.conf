server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Mock interview and behavioral drills POST base64 audio, which runs to a few
    # MB for a long answer. Must stay at or above the backend's own body limit,
    # or nginx 413s the request before the backend ever sees it. Laravel has no
    # equivalent JSON limit of its own -- the ceiling is PHP's post_max_size and
    # upload_max_filesize, both 8M by default, so the FrankenPHP image raises
    # them rather than letting a long answer fail at the PHP layer.
    client_max_body_size 10m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite emits content-hashed filenames, so these are safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # /api/ is Laravel (task 4.1). No trailing slash on proxy_pass, so the
    # /api prefix is preserved -- Laravel's routes are registered under it.
    # Model calls can run long, so the read timeout is well above the nginx
    # default of 60s.
    location /api/ {
        proxy_pass http://laravel:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Still Express. The client sends every AI call to /api/ai/... (API_BASE is
    # '/api' in services/http.ts), so nothing reaches this location any more;
    # it stays until task 4.2 retires the Express container outright.
    location /ai/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # React Router owns client-side routing, so unknown paths fall back to the
    # app shell rather than returning 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
