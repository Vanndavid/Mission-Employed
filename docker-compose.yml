services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: mission_employed_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 3001
      # The accounts store is a JSON file, so it lives on a volume rather than
      # inside the container layer. TALENT_FILE is gone with the talent
      # ranking feature. Since task 4.1 this service only serves /ai/, which
      # nothing calls; it is deleted in 4.2 once Laravel is confirmed.
      USERS_FILE: /data/users.json
    volumes:
      - api_data:/data

  laravel:
    build:
      context: .
      dockerfile: Dockerfile.laravel
    container_name: mission_employed_laravel
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      # Absolute, because the file lives on the volume below rather than under
      # the app directory. Laravel resolves a relative DB_DATABASE against
      # backend/, which would put it in the container layer and lose every
      # account on redeploy.
      DB_CONNECTION: sqlite
      DB_DATABASE: /data/database.sqlite
      # Errors (including a failing /api/health) go to `docker compose logs
      # laravel`, not to storage/logs inside the container, which every
      # redeploy throws away.
      LOG_CHANNEL: stderr
      SERVER_NAME: ":8080"
    volumes:
      - laravel_data:/data

  # The remote MCP connector (Claude, Cowork). Deliberately not on env_file:
  # it needs no Gemini key or APP_KEY, only these, interpolated from .env.
  mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    container_name: mission_employed_mcp
    restart: unless-stopped
    environment:
      MISSION_EMPLOYED_API_URL: http://laravel:8080
      # The issuer and resource URL clients see. Must be the public origin in
      # production; localhost is allowed over plain http for local runs.
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-http://localhost:8090}
      MCP_OAUTH_SECRET: ${MCP_OAUTH_SECRET:?set MCP_OAUTH_SECRET in .env (openssl rand -base64 48)}
      PORT: 8787
    depends_on:
      - laravel

  nginx:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mission_employed_nginx
    restart: unless-stopped
    depends_on:
      - api
      - laravel
    ports:
      - "8090:80"

volumes:
  api_data:
  laravel_data:
