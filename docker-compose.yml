services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: mission_employed_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 3001
      # The accounts store is a JSON file, so it lives on a volume rather than
      # inside the container layer. TALENT_FILE is gone with the talent
      # ranking feature; the Laravel cutover replaces this with SQLite.
      USERS_FILE: /data/users.json
    volumes:
      - api_data:/data

  nginx:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mission_employed_nginx
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8090:80"

volumes:
  api_data:
