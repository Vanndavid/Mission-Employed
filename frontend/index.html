
<!DOCTYPE html>
<html lang="en" data-palette="forest">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONE PARTNER — Mission: Employed</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: 'rgb(var(--brand-50) / <alpha-value>)',
                            100: 'rgb(var(--brand-100) / <alpha-value>)',
                            200: 'rgb(var(--brand-200) / <alpha-value>)',
                            300: 'rgb(var(--brand-300) / <alpha-value>)',
                            400: 'rgb(var(--brand-400) / <alpha-value>)',
                            500: 'rgb(var(--brand-500) / <alpha-value>)',
                            600: 'rgb(var(--brand-600) / <alpha-value>)',
                            700: 'rgb(var(--brand-700) / <alpha-value>)',
                            800: 'rgb(var(--brand-800) / <alpha-value>)',
                            900: 'rgb(var(--brand-900) / <alpha-value>)',
                        },
                    },
                    fontFamily: {
                        sans: ['IBM Plex Sans', 'system-ui', 'sans-serif'],
                        mono: ['IBM Plex Mono', 'ui-monospace', 'monospace'],
                        display: ['IBM Plex Sans', 'system-ui', 'sans-serif'],
                    },
                },
            },
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-50: 236 253 245;
            --brand-100: 209 250 229;
            --brand-200: 167 243 208;
            --brand-300: 110 231 183;
            --brand-400: 52 211 153;
            --brand-500: 16 185 129;
            --brand-600: 5 150 105;
            --brand-700: 4 120 87;
            --brand-800: 6 95 70;
            --brand-900: 6 78 59;
            --app-bg: linear-gradient(160deg, #f8fafc 0%, #ecfdf5 45%, #f1f5f9 100%);
        }
        body {
            font-family: 'IBM Plex Sans', system-ui, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: var(--app-bg);
            background-attachment: fixed;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        html.dark {
            color-scheme: dark;
        }
    </style>
</head>
<body class="transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
